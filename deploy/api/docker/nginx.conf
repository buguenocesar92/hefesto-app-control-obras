user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Los datos de obra van con su nombre de origen para que el navegador no
    # se lo confunda con otro recurso.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        # El puerto interno no se pública al exterior: solo Caddy llega aca.
        listen 8080;
        server_name _;

        root /var/www/html/public;
        index index.php;

        client_max_body_size 12m;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
            include fastcgi_params;

            # Toda consulta pasa por index.php: en una aplicación como esta no
            # hay archivos PHP que se sirvan directo, y cada ruta se resuelve
            # en Laravel, que es donde esta la autorizacion.
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}