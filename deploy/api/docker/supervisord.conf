; ---------------------------------------------------------------------------
; Supervisor: nginx y PHP-FPM en un solo contenedor.
; ---------------------------------------------------------------------------
; Dos procesos en un contenedor no es la forma ideal de hacer las cosas, y
; queda anotado como deuda en docs/08. Se hace así para no depender de dos
; servicios más en un despliegue donde solo entra el proxy.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0