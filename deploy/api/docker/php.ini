# ---------------------------------------------------------------------------
# Configuración de PHP
# ---------------------------------------------------------------------------

; No mostrar errores en pantalla: un error de PHP con su ruta expuesta es
; información gratis para quien tenga una pantalla abierta en la obra.
display_errors = Off
display_startup_errors = Off

log_errors = On
error_log = /dev/stderr

; Los errores de la aplicación van al log estructurado de Laravel, no al log
; crudo de PHP. El log crudo solo queda para lo que no pasa por Laravel.
expose_php = Off

; Memoria y tiempos. Una obra se consulta desde conexiones lentas: es mejor
; una petición que tarda y responde, que una que expira.
memory_limit = 256M
max_execution_time = 60

; En produccion, con la cache de configuración puesta, esto ya no se vuelve a
; leer. Es una red de seguridad para el caso de que falte.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0

; Zona horaria de Chile continental. El atraso de una etapa se cuenta por
; fecha, y una fecha mal interpretada cambia el atraso en un día entero.
date.timezone = America/Santiago

; Sesiones en base de datos: la cookie es pequena y el estado no viaja en el
; navegador.
session.use_strict_mode = 1
session.cookie_httponly = 1